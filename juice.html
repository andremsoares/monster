<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="juice.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet">
    <title>Monster Juice</title>
</head>

<body>
    <header>
        <div class="logo-header">
            <img src="./imagens/logo.png" alt="logo no header">
        </div>
        <p class="promocoes">PROMOÇÕES</p>
        <div class="global">
            <img src="./imagens/7d71334f38a03662f7e142b7de00d42e31c0f8a8.png" alt="símbolo global">
        </div>
        <div class="texto-header">
            <p class="br">BR</p>
        </div>
    </header>
    <main>
        <img class="background" src="./imagens/background.png" alt="background monster">
        <div class="lata">
            <img src="./imagens/moster.png" alt="lata de monster">
        </div>
        <div class="container-titulo">
            <h2 class="titulo1">MEGA</h2>
            <h2 class="titulo2">MONSTER</h2>
            <h2 class="energy">ENERGY</h2>
        </div>
        <h2 class="subtitulo">O sabor de Monster é ao mesmo tempo marcante e suave.</h2>
        <img class="monster-logo" src="./imagens/logo-image.png" alt="">
        <h2 class="monster-texto">Monster Energy Original</h2>
    </main>
    <footer>
        <a href="./index.html">
            <img class="seta-esquerda" src="./imagens/seta-esquerda.png" alt="seta para esquerda">
        </a>
        <a href="./grape.html">
            <img class="seta-direita" src="./imagens/seta-direita.png" alt="seta para direita">
        </a>
        <p class="autor">by: André Soares</p>
    </footer>
</body>

</html>
